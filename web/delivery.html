<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="调研交付台交付结果阅读页" />
  <title>慢性植入神经接口｜本地交付阅读</title>
  <link rel="stylesheet" href="./prototype.css" />
  <link rel="stylesheet" href="./prototype-typography.css" />
  <link rel="stylesheet" href="./delivery.css?v=3" />
  <link rel="stylesheet" href="./delivery-menu.css?v=3" />
  <link rel="stylesheet" href="./delivery-mobile.css?v=3" />
  <link rel="stylesheet" href="./delivery-motion.css?v=9" />
  <link rel="stylesheet" href="./delivery-result.css?v=6" />
  <link rel="stylesheet" href="./delivery-title-hierarchy.css?v=1" />
  <script src="./sample-delivery/data.js?v=9" defer></script>
  <script src="./delivery.js?v=17" defer></script>
</head>
<body class="delivery-page">
  <header class="site-header delivery-site-header">
    <a class="brand" href="./prototype.html#sample" aria-label="返回调研交付台原型"><span class="brand-mark report-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.8 6.2c2.7-.8 5-.2 7.2 1.4v11c-2.2-1.6-4.5-2.1-7.2-1.3V6.2Zm14.4 0c-2.7-.8-5-.2-7.2 1.4v11c2.2-1.6 4.5-2.1 7.2-1.3V6.2Z"/><path d="M12 7.6v11"/></svg></span><span>调研交付台</span></a>
    <button class="header-action login-pending" type="button" aria-disabled="true" title="邮箱登录尚未接入">邮箱登录 <span>待接入</span></button>
  </header>

  <main id="delivery-reader" class="delivery-workspace" tabindex="-1">
    <section class="delivery-app" aria-busy="true">
      <div class="result-heading">
        <h1>导电水凝胶在慢性植入神经接口中的应用</h1>
      </div>
      <div class="delivery-toolbar">
        <div class="delivery-view-tabs" role="tablist" aria-label="交付内容">
          <button type="button" role="tab" aria-selected="true" data-view="report">调研报告</button>
          <button type="button" role="tab" aria-selected="false" data-view="slides">PPT 逐页讲稿</button>
          <button type="button" role="tab" aria-selected="false" data-view="sources">引用与图源</button>
          <span class="view-tab-indicator" aria-hidden="true"></span>
        </div>
        <div class="delivery-actions">
          <button type="button" id="copy-current">复制当前内容</button>
          <div class="download-menu">
            <button type="button" id="download-trigger" aria-haspopup="menu" aria-expanded="false">下载</button>
            <div id="download-options" class="download-options" role="menu" hidden>
              <button type="button" role="menuitem" data-kind="report" data-format="markdown"><strong>完整报告 · Markdown</strong><span>导出全部报告正文</span></button>
              <button type="button" role="menuitem" data-kind="report" data-format="html"><strong>完整报告 · HTML</strong><span>完整网页文件，浏览器直接打开</span></button>
              <button type="button" role="menuitem" data-kind="report" data-format="pdf"><strong>完整报告 · PDF</strong><span>打印窗口中保存</span></button>
              <button type="button" role="menuitem" data-kind="slides" data-format="markdown"><strong>完整 PPT 内容包 · Markdown</strong><span>全部页面与讲稿</span></button>
              <button type="button" role="menuitem" data-kind="slides" data-format="html"><strong>完整 PPT 内容包 · HTML</strong><span>逐页排版，浏览器直接打开</span></button>
              <button type="button" role="menuitem" data-kind="slides" data-format="pdf"><strong>完整 PPT 内容包 · PDF</strong><span>打印窗口后保存为 PDF</span></button>
            </div>
          </div>
        </div>
      </div>
      <p id="action-feedback" class="action-feedback" role="status"></p>
      <div id="load-error" class="delivery-message" hidden role="alert">
        <h2>本地样本未能载入</h2>
        <p>请通过仓库的本地服务打开此页面；直接双击 HTML 时，浏览器通常会阻止读取相邻文件。</p>
        <button type="button" id="retry-load">重新载入</button>
      </div>
      <div id="loading-state" class="delivery-message"><span class="loading-ring" aria-hidden="true"></span><p>正在读取已保存的本地交付……</p></div>
      <div id="delivery-body" class="delivery-body" hidden>
        <aside id="content-index" class="content-index" aria-label="当前内容目录"></aside>
        <article id="content-panel" class="content-panel"></article>
      </div>
    </section>

    <section class="boundary-note">
      <span class="section-kicker">能力边界</span>
      <h2>可阅读，不等于已上线。</h2>
      <p>此页只验证真实交付的阅读、复制和下载体验。样本经过人工学术润色，不能代表当前自动生成质量；引用与图源仍应在正式使用前核对，许可未知的论文图片仅提供原文入口，不自动嵌入。</p>
    </section>
  </main>
  <footer><div class="page-width footer-inner"><span class="brand"><span class="brand-mark report-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.8 6.2c2.7-.8 5-.2 7.2 1.4v11c-2.2-1.6-4.5-2.1-7.2-1.3V6.2Zm14.4 0c-2.7-.8-5-.2-7.2 1.4v11c2.2-1.6 4.5-2.1 7.2-1.3V6.2Z"/><path d="M12 7.6v11"/></svg></span><span>调研交付台</span></span><p>本地交付阅读检查点 · 正式服务尚未开放</p><a href="#delivery-reader">回到顶部 ↑</a></div></footer>
</body>
</html>
